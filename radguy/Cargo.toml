[package]
name = "radguy"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.14.0"
orx-priority-queue = { workspace = true }
fixedbitset = { workspace = true }
roaring = "0.11.2"
rand="0.9.2"
chrono = { optional = true, version = "0.4.42" }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = { level = "deny" }
missing_panics_doc = { level = "allow" }
too_many_lines = { level = "allow" }

[features]
timeout = ["dep:chrono"]
